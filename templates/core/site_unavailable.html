{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Unavailable | HRequest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #174F91 0%, #0F3562 100%);
            overflow: hidden;
        }
        .lock-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
        }
        .lock-popup {
            position: relative;
            z-index: 10;
            background: #FFFFFF;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 24px 48px rgba(15, 53, 98, 0.35);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .lock-logo {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            object-fit: cover;
            padding: 3px;
            background: #FFFFFF;
            box-shadow: 0 4px 14px rgba(23, 79, 145, 0.18);
            margin-bottom: 1rem;
        }
        .lock-badge {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #FEF3C7;
            color: #B45309;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }
        @keyframes popIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="lock-backdrop"></div>
    <div class="lock-popup" role="dialog" aria-modal="true" aria-labelledby="siteUnavailableTitle">
        <img src="{% static 'brand/logo.png' %}" alt="HRequest Logo" class="lock-logo">
        <div>
            <span class="lock-badge">
                <i class="bi bi-lock-fill"></i>
            </span>
        </div>
        <h4 id="siteUnavailableTitle" class="fw-bold text-dark mb-2">Website Unavailable</h4>
        <p class="text-muted small mb-0" style="line-height: 1.6;">
            This website is currently unavailable.<br>
            Please contact the developer for access or further assistance.
        </p>
    </div>
</body>
</html>
